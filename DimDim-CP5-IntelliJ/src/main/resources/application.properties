spring.application.name=dimdim

# Azure SQL criado no CP5
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://sql-dimdim-cp5-561694.database.windows.net:1433;database=DimDimDB;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sqladmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# As tabelas ja existem no Azure SQL; o Hibernate nao deve recria-las
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}
