<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Transações | DimDim</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="container"><h1>Transações</h1><p><a class="btn" th:href="@{/transacoes/novo}">Nova transação</a> <a th:href="@{/dashboard}">Dashboard</a></p><p th:if="${sucesso}" th:text="${sucesso}"></p><table><thead><tr><th>ID</th><th>Descrição</th><th>Valor</th><th>Tipo</th><th>Data</th><th>Usuário</th><th>Ações</th></tr></thead><tbody><tr th:each="t:${transacoes}"><td th:text="${t.id}"></td><td th:text="${t.descricao}"></td><td th:text="${t.valor}"></td><td th:text="${t.tipo.descricao}"></td><td th:text="${#temporals.format(t.dataTransacao,'dd/MM/yyyy HH:mm')}"></td><td th:text="${t.usuario.nome}"></td><td><a th:href="@{/transacoes/{id}/editar(id=${t.id})}">Editar</a> <form th:action="@{/transacoes/{id}/excluir(id=${t.id})}" method="post" style="display:inline"><button type="submit">Excluir</button></form></td></tr></tbody></table></main></body></html>
