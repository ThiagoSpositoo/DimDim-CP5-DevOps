<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Transação | DimDim</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="container"><h1 th:text="${transacaoId==null?'Nova transação':'Editar transação'}"></h1><form th:object="${form}" th:action="${transacaoId==null}?@{/transacoes}:@{/transacoes/{id}(id=${transacaoId})}" method="post"><label>Usuário</label><select th:field="*{usuarioId}" required><option value="">Selecione</option><option th:each="u:${usuarios}" th:value="${u.id}" th:text="${u.nome+' - '+u.email}"></option></select><label>Descrição</label><input th:field="*{descricao}" required><label>Valor</label><input type="number" step="0.01" min="0.01" th:field="*{valor}" required><label>Tipo</label><select th:field="*{tipo}" required><option th:each="t:${tipos}" th:value="${t}" th:text="${t.descricao}"></option></select><button type="submit">Salvar</button> <a th:href="@{/transacoes}">Cancelar</a></form></main></body></html>
