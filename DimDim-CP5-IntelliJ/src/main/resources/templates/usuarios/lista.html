<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Usuários | DimDim</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="container"><h1>Usuários</h1><p><a class="btn" th:href="@{/usuarios/novo}">Novo usuário</a> <a th:href="@{/dashboard}">Dashboard</a></p><p th:if="${sucesso}" th:text="${sucesso}"></p><table><thead><tr><th>ID</th><th>Nome</th><th>E-mail</th><th>Ações</th></tr></thead><tbody><tr th:each="u:${usuarios}"><td th:text="${u.id}"></td><td th:text="${u.nome}"></td><td th:text="${u.email}"></td><td><a th:href="@{/usuarios/{id}/editar(id=${u.id})}">Editar</a> <form th:action="@{/usuarios/{id}/excluir(id=${u.id})}" method="post" style="display:inline"><button type="submit">Excluir</button></form></td></tr></tbody></table></main></body></html>
