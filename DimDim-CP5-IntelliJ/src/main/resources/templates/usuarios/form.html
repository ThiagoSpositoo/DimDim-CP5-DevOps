<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Usuário | DimDim</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="container"><h1 th:text="${usuario.id==null?'Novo usuário':'Editar usuário'}"></h1><form th:object="${usuario}" th:action="${usuario.id==null}?@{/usuarios}:@{/usuarios/{id}(id=${usuario.id})}" method="post"><label>Nome</label><input th:field="*{nome}" required><small th:errors="*{nome}"></small><label>E-mail</label><input type="email" th:field="*{email}" required><small th:errors="*{email}"></small><button type="submit">Salvar</button> <a th:href="@{/usuarios}">Cancelar</a></form></main></body></html>
