<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Dashboard | DimDim</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="container"><h1>DimDim</h1><p><a th:href="@{/usuarios}">Usuários</a> | <a th:href="@{/transacoes}">Transações</a></p><h2>Resumo</h2><p>Usuários: <strong th:text="${totalUsuarios}"></strong> | Transações: <strong th:text="${qtdTransacoes}"></strong></p><p>Entradas: R$ <strong th:text="${entradas}"></strong> | Saídas: R$ <strong th:text="${saidas}"></strong> | Saldo: R$ <strong th:text="${saldo}"></strong></p><h2>Últimas transações</h2><table><tr><th>Descrição</th><th>Valor</th><th>Tipo</th><th>Usuário</th></tr><tr th:each="t:${ultimas}"><td th:text="${t.descricao}"></td><td th:text="${t.valor}"></td><td th:text="${t.tipo.descricao}"></td><td th:text="${t.usuario.nome}"></td></tr></table></main></body></html>
